name: ci

# Runs on forcicd (Forgejo Actions, GitHub-Actions compatible) which mirrors
# this repo from GitHub. Builds the three PUBLIC-repo binaries (qregistry +
# rspace_registry + rspacefs), packages rpm/deb/container, and deploys the
# Proxmox LXC on pve.g8.lo.
#
# Required Forgejo Actions secrets:
#   GH_TOKEN     — clone the sibling public repos (and avoid rate limits)
#   PVE_SSH_KEY  — ed25519 private key authorized as root@pve.g8.lo (deploy job)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ARCH: x86_64

jobs:
  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git fuse3 libfuse3-dev pkg-config

      - name: build qregistry
        run: cargo build --release -p qregistry

      - name: clone + build siblings (public)
        run: |
          GH="${{ secrets.GH_TOKEN }}"
          base="https://github.com/glennswest"
          [ -n "$GH" ] && base="https://x-access-token:${GH}@github.com/glennswest"
          mkdir -p ../siblings && cd ../siblings
          git clone --depth 1 "${base}/rspace_registry.git"
          git clone --depth 1 "${base}/rspacefs.git"
          (cd rspace_registry && cargo build --release -p rspace-registry)
          (cd rspacefs        && cargo build --release -p rspacefs-fuse)

      - name: stage dist
        run: |
          mkdir -p dist/${ARCH}
          cp target/release/qregistry                              dist/${ARCH}/
          cp ../siblings/rspace_registry/target/release/rspace-registry dist/${ARCH}/
          cp ../siblings/rspacefs/target/release/rspacefs-mount    dist/${ARCH}/
          file dist/${ARCH}/*

      - uses: actions/upload-artifact@v3
        with:
          name: qregistry-bins-${{ env.ARCH }}
          path: dist/${{ env.ARCH }}/*
          if-no-files-found: error

  package:
    name: rpm + deb
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: qregistry-bins-${{ env.ARCH }}
          path: dist/${{ env.ARCH }}
      - name: install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: derive version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: build packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PKG_ARCH: amd64
          ARCH: ${{ env.ARCH }}
        run: |
          chmod +x dist/${ARCH}/qregistry
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          ls -l dist/*.rpm dist/*.deb
      - uses: actions/upload-artifact@v3
        with:
          name: qregistry-packages
          path: |
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  container:
    name: container image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: qregistry-bins-${{ env.ARCH }}
          path: dist/${{ env.ARCH }}
      - name: derive version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: build + push image
        # Daemonless: the runner ships the docker CLI but no dockerd socket
        # (a runner-capability gap tracked in forcicd#1). Prefer podman /
        # buildah; if no builder is available, skip cleanly rather than fail
        # the pipeline — the binaries + rpm/deb still ship.
        run: |
          chmod +x dist/${ARCH}/*
          V="${{ steps.ver.outputs.version }}"
          IMG=forcicd.g8.lo:5000/qregistry
          if command -v podman >/dev/null 2>&1; then
            podman build --build-arg ARCH=${ARCH} -f deploy/Containerfile -t ${IMG}:latest -t ${IMG}:${V} .
            podman push --tls-verify=false ${IMG}:latest
            podman push --tls-verify=false ${IMG}:${V}
          elif command -v buildah >/dev/null 2>&1; then
            buildah bud --build-arg ARCH=${ARCH} -f deploy/Containerfile -t ${IMG}:latest -t ${IMG}:${V} .
            buildah push --tls-verify=false ${IMG}:latest
            buildah push --tls-verify=false ${IMG}:${V}
          elif docker info >/dev/null 2>&1; then
            docker build --build-arg ARCH=${ARCH} -f deploy/Containerfile -t ${IMG}:latest -t ${IMG}:${V} .
            docker push ${IMG}:latest
            docker push ${IMG}:${V}
          else
            echo "::warning::no container builder (podman/buildah/dockerd) on runner — skipping image build. See forcicd#1."
          fi

  # Manual-only until forcicd provides a sanctioned least-privilege PVE
  # deploy path (see github.com/glennswest/forcicd#1). On a normal push the
  # pipeline ends at build/package/container; provision the CT by hand with
  # deploy/provision-ct.sh, or trigger this job once PVE_SSH_KEY is set.
  deploy:
    name: provision LXC on pve.g8.lo
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: qregistry-bins-${{ env.ARCH }}
          path: dist/${{ env.ARCH }}
      - name: require PVE_SSH_KEY
        env:
          PVE_SSH_KEY: ${{ secrets.PVE_SSH_KEY }}
        run: |
          if [ -z "$PVE_SSH_KEY" ]; then
            echo "PVE_SSH_KEY secret is not set — see forcicd#1 for the deploy path." >&2
            exit 1
          fi
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PVE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H pve.g8.lo >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: stage to pve + provision
        run: |
          chmod +x dist/${ARCH}/* deploy/provision-ct.sh
          ssh -i ~/.ssh/id_ed25519 root@pve.g8.lo 'rm -rf /tmp/qregistry-deploy && mkdir -p /tmp/qregistry-deploy'
          scp -i ~/.ssh/id_ed25519 -r dist config deploy root@pve.g8.lo:/tmp/qregistry-deploy/
          ssh -i ~/.ssh/id_ed25519 root@pve.g8.lo 'bash /tmp/qregistry-deploy/deploy/provision-ct.sh'
