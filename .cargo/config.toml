# Cross-compile linker config.
#
# macOS host -> Linux musl static binaries. Without these, cargo invokes
# `cc` (clang) which doesn't understand GNU ld flags. The musl-cross
# homebrew formulas ship working aarch64-linux-musl-gcc and
# x86_64-linux-musl-gcc.

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
