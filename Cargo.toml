[workspace]
members = [
    "crates/qregistry",
    "crates/qregistry-core",
    "crates/qregistry-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Glenn West"]
license = "MIT"
repository = "https://github.com/glennswest/qregistry"
rust-version = "1.75"
description = "Container registry appliance: stormd + rspace_registry + rspacefs in one scratch image."

[workspace.dependencies]
# HTTP / async
axum = { version = "0.7", features = ["macros", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
hyper = "1"
http = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Auth
bcrypt = "0.15"
base64 = "0.22"

# Errors + logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
